<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirrorly</title>
  <link rel="icon" href="../icons/icon32.png">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #16181d;
      --muted: #5b6270;
      --accent: #3b5bdb;
      --border: #d9dce2;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --card: #1b1e24;
        --text: #eceef2;
        --muted: #a3a9b5;
        --accent: #7b94ff;
        --border: #313640;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.5 system-ui, "Segoe UI", "Noto Sans Georgian", sans-serif;
    }
    main {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
    }
    header { display: flex; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 26px; }
    .lead { margin: 16px 0 24px; font-size: 20px; }
    ol { margin: 0 0 24px; padding-left: 1.4em; }
    li { margin-bottom: 10px; }
    li::marker { color: var(--accent); font-weight: 700; }
    .note { margin: 0 0 8px; color: var(--muted); font-size: 16px; }
    @media (max-width: 480px) { main { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="../icons/icon48.png" width="40" height="40" alt="">
      <h1 data-i18n="welcomeTitle">Mirrorly is installed</h1>
    </header>
    <p class="lead" data-i18n="welcomeLead"></p>
    <ol>
      <li data-i18n="welcomeStep1"></li>
      <li data-i18n="welcomeStep2"></li>
      <li data-i18n="welcomeStep3"></li>
    </ol>
    <p class="note" data-i18n="welcomeZoom"></p>
    <p class="note" data-i18n="welcomePrivacy"></p>
  </main>
  <script src="welcome.js"></script>
</body>
</html>
